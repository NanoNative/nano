name: 🧪 CI · Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      ref:
        description: Ref.
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: build-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: read
    uses: NanoNative/NanoNative/.github/workflows/wc_java_build_common.yml@45738a83961ad524700a86641a85a4e0435954c0
    with:
      ref: ${{ github.event.inputs.ref || github.sha }}
